name: Debug compat image build

on:
  push:
    paths:
      - ".github/workflows/debug-image.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with visible log
        run: |
          set +e
          docker build --progress=plain -f docker/tauri2-webkit41.Dockerfile . > build-image.log 2>&1
          rc=$?
          {
            echo "### docker build rc=$rc"
            echo '```'
            tail -n 150 build-image.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Publish log as commit comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'no build.log in ' + process.cwd();
            try { log = fs.readFileSync('build-image.log', 'utf8'); } catch (e) { log += '\n' + e.message; }
            const tail = log.split('\n').slice(-120).join('\n').slice(-60000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### debug image build\n\n```\n' + tail + '\n```'
            });
