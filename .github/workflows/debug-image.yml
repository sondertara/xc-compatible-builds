name: Debug compat image build

on:
  push:
    paths:
      - ".github/workflows/debug-image.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with visible log
        run: |
          set +e
          docker build --progress=plain -f docker/tauri2-webkit41.Dockerfile . > build-image.log 2>&1
          rc=$?
          {
            echo "### docker build rc=$rc"
            echo '```'
            tail -n 150 build-image.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Publish log to debug branch
        if: always()
        run: |
          set -euo pipefail
          if [ -f build-image.log ]; then
            tail -n 400 build-image.log > debug-image.log
          else
            echo "build-image.log missing; pwd=$(pwd)" > debug-image.log
            ls -la >> debug-image.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-logs
          git add -f debug-image.log
          git commit -m "debug image log ${GITHUB_RUN_ID}" || true
          git push -f origin HEAD:debug-logs
