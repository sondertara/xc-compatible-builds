name: ThinkRail Kylin compat (glibc 2.31 / WebKitGTK 4.0)

# ThinkRail is an Electrobun app, so it cannot use reusable-appimage.yml
# (that workflow is Tauri/AppImage-only and requires WebKitGTK 4.1 >= 2.40).
# This is the ThinkRail counterpart of gonavi-build.yml.
# Weekly upstream checks are centralized in .github/workflows/upstream-watch.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ThinkRail version (e.g. 0.3.2) or tag (v0.3.2); empty = latest release"
        required: false
        type: string
  push:
    branches: [thinkrail-kylin]
    paths:
      - ".github/workflows/thinkrail-compat.yml"
      - "apps/thinkrail/**"

permissions:
  contents: write

concurrency:
  group: thinkrail-kylin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api repos/JetBrains/thinkrail/releases/latest --jq .tag_name)"
          elif [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved $TAG (version $VERSION)"

  build:
    name: Build (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            upstream_arch: x64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            upstream_arch: arm64
    env:
      DEBIAN_FRONTEND: noninteractive
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      ARCH: ${{ matrix.arch }}
      UPSTREAM_ARCH: ${{ matrix.upstream_arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies (focal)
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/apt.log"
          apt-get -o Acquire::Retries=3 update >"$LOG" 2>&1
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates curl git build-essential g++-10 pkg-config patch file \
            zstd bzip2 patchelf \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxext-dev libxrender-dev libxcomposite-dev libxdamage-dev \
            >>"$LOG" 2>&1

      - name: Publish apt log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const logPath = (process.env.GITHUB_WORKSPACE || '') + '/apt.log';
            if (!fs.existsSync(logPath)) return;
            const log = fs.readFileSync(logPath, 'utf8').slice(-40000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'apt failure log:\n```\n' + log + '\n```'
            });

      - name: Preflight ABI (glibc 2.31, WebKitGTK 4.0 2.38.x)
        shell: bash
        run: |
          set -euo pipefail
          {
            getconf GNU_LIBC_VERSION
            pkg-config --modversion webkit2gtk-4.0
            pkg-config --modversion gtk+-3.0
            pkg-config --modversion libsoup-2.4
          } 2>&1 | tee preflight.log
          test "$(getconf GNU_LIBC_VERSION | awk '{print $2}')" = "2.31"
          WEBKIT="$(pkg-config --modversion webkit2gtk-4.0)"
          echo "webkit2gtk-4.0: $WEBKIT"
          case "$WEBKIT" in 2.38.*) ;; *) echo "expected WebKitGTK 4.0 2.38.x"; exit 1 ;; esac

      - name: Publish preflight log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const p = (process.env.GITHUB_WORKSPACE || '') + '/preflight.log';
            if (!fs.existsSync(p)) return;
            const log = fs.readFileSync(p, 'utf8').slice(-20000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'preflight failure:\n```\n' + log + '\n```'
            });

      - name: Download upstream app tree
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee download.log) 2>&1
          ASSET="stable-linux-${UPSTREAM_ARCH}-ThinkRail-${VERSION}.tar.zst"
          URL="https://github.com/JetBrains/thinkrail/releases/download/${TAG}/${ASSET}"
          echo "GET $URL"
          curl -fL --retry 3 --retry-delay 5 -o thinkrail.tar.zst "$URL"
          ls -lh thinkrail.tar.zst
          zstd -dc thinkrail.tar.zst | tar -xf - -C .
          ls -l ThinkRail/bin/launcher
          test -x ThinkRail/bin/launcher

      - name: Publish download log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const p = (process.env.GITHUB_WORKSPACE || '') + '/download.log';
            if (!fs.existsSync(p)) return;
            const log = fs.readFileSync(p, 'utf8').slice(-20000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'download failure:\n```\n' + log + '\n```'
            });

      - name: Fetch Electrobun 2.0.5 source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee electrobun.log) 2>&1
          curl -fL --retry 3 --retry-delay 5 -w 'http=%{http_code}\n' \
            -o electrobun.tar.gz \
            "https://github.com/blackboardsh/electrobun/archive/refs/tags/v2.0.5.tar.gz"
          ls -lh electrobun.tar.gz
          tar -xzf electrobun.tar.gz
          ls -d electrobun*
          mv electrobun-2.0.5 electrobun

      - name: Publish electrobun log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const p = (process.env.GITHUB_WORKSPACE || '') + '/electrobun.log';
            if (!fs.existsSync(p)) return;
            const log = fs.readFileSync(p, 'utf8').slice(-20000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'electrobun failure:\n```\n' + log + '\n```'
            });

      - name: Fetch CEF 156 headers
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee cef.log) 2>&1
          CEF_URL="https://cef-builds.spotifycdn.com/cef_binary_156.0.7%2Bg47dbc1d%2Bchromium-156.0.8078.17_linux64_minimal.tar.bz2"
          echo "GET $CEF_URL"
          curl -fL --retry 3 --retry-delay 5 -w 'http=%{http_code} size=%{size_download}\n' -o cef.tar.bz2 "$CEF_URL"
          ls -lh cef.tar.bz2
          tar -tjf cef.tar.bz2 >/dev/null
          mkdir -p cef
          tar -xjf cef.tar.bz2 --strip-components=1 -C cef
          test -f cef/include/cef_app.h

      - name: Publish CEF log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const p = (process.env.GITHUB_WORKSPACE || '') + '/cef.log';
            if (!fs.existsSync(p)) return;
            const log = fs.readFileSync(p, 'utf8').slice(-20000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'cef failure:\n```\n' + log + '\n```'
            });

      - name: Install Dawn webgpu.h
        run: |
          set -euo pipefail
          mkdir -p wgpu/dawn
          cp "$GITHUB_WORKSPACE/apps/thinkrail/third_party/webgpu.h" wgpu/dawn/webgpu.h
          test -s wgpu/dawn/webgpu.h

      - name: Apply WebKitGTK 4.0 compatibility patch
        run: |
          set -euo pipefail
          cd electrobun
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/apps/thinkrail/electrobun-2.0.5-webkit40.patch"
          patch -p1 < "$GITHUB_WORKSPACE/apps/thinkrail/electrobun-2.0.5-webkit40.patch"

      - name: Build libNativeWrapper.so against WebKitGTK 4.0
        run: |
          set -euo pipefail
          exec > >(tee build.log) 2>&1
          cd "$GITHUB_WORKSPACE/electrobun/package"
          CXX=g++-10
          CXXFLAGS="$(pkg-config --cflags webkit2gtk-4.0 gtk+-3.0 ayatana-appindicator3-0.1)"
          LIBS="$(pkg-config --libs webkit2gtk-4.0 gtk+-3.0 ayatana-appindicator3-0.1)"
          FS=""
          if [ -f "$($CXX -print-file-name=libstdc++fs.a)" ]; then FS="-lstdc++fs"; fi

          $CXX -std=c++2a -fPIC -O2 $CXXFLAGS \
            -I"$GITHUB_WORKSPACE/cef" -I"$GITHUB_WORKSPACE/wgpu" \
            -c -o nativeWrapper.o src/native/linux/nativeWrapper.cpp
          $CXX -std=c++2a -fPIC -O2 $CXXFLAGS \
            -I"$GITHUB_WORKSPACE/cef" -I"$GITHUB_WORKSPACE/wgpu" \
            -c -o wayland_screen_capture.o src/native/linux/wayland_screen_capture.cpp
          $CXX -std=c++2a -fPIC -O2 $CXXFLAGS \
            -I"$GITHUB_WORKSPACE/cef" -I"$GITHUB_WORKSPACE/wgpu" \
            -c -o wayland_pipewire_capture.o src/native/linux/wayland_pipewire_capture.cpp

          $CXX -shared -o libNativeWrapper.so \
            nativeWrapper.o wayland_screen_capture.o wayland_pipewire_capture.o \
            "$GITHUB_WORKSPACE/ThinkRail/bin/libasar.so" \
            $LIBS -ldl -lpthread $FS

      - name: Publish build log
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const p = (process.env.GITHUB_WORKSPACE || '') + '/build.log';
            if (!fs.existsSync(p)) return;
            const log = fs.readFileSync(p, 'utf8').slice(-40000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'build failure:\n```\n' + log + '\n```'
            });

      - name: Verify ABI and exports
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          OFFICIAL="ThinkRail/bin/libNativeWrapper.so"
          REBUILT="electrobun/package/libNativeWrapper.so"

          nm -D --defined-only "$OFFICIAL" | awk '$2=="T"{print $3}' | grep -v '^_Z' | sort > official.txt
          nm -D --defined-only "$REBUILT" | awk '$2=="T"{print $3}' | grep -v '^_Z' | sort > rebuilt.txt
          echo "official exports: $(wc -l < official.txt), rebuilt exports: $(wc -l < rebuilt.txt)"
          MISSING="$(comm -23 official.txt rebuilt.txt)"
          if [ -n "$MISSING" ]; then
            echo "Missing exports:"
            echo "$MISSING"
            exit 1
          fi
          if nm -D "$REBUILT" | grep -q 'webkit_web_view_evaluate_javascript'; then
            echo "4.1-only symbol is still referenced"
            exit 1
          fi

          NEEDED="$(readelf -d "$REBUILT" | grep NEEDED)"
          echo "$NEEDED"
          echo "$NEEDED" | grep -q 'libwebkit2gtk-4.0.so.37'
          echo "$NEEDED" | grep -q 'libsoup-2.4.so.1'
          if echo "$NEEDED" | grep -qE 'webkit2gtk-4\.1|soup-3\.0'; then
            echo "unexpected 4.1/soup3 dependency"
            exit 1
          fi

          MAX_GLIBC="$(objdump -T "$REBUILT" | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1)"
          MAX_CXX="$(objdump -T "$REBUILT" | grep -oE 'GLIBCXX_[0-9.]+' | sort -V | tail -1)"
          echo "max $MAX_GLIBC, $MAX_CXX"
          test "$(printf '%s\n%s\n' GLIBC_2.31 "$MAX_GLIBC" | sort -V | tail -1)" = "GLIBC_2.31"
          test "$(printf '%s\n%s\n' GLIBCXX_3.4.28 "$MAX_CXX" | sort -V | tail -1)" = "GLIBCXX_3.4.28"

      - name: Install and smoke-test linkage
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cp electrobun/package/libNativeWrapper.so ThinkRail/bin/libNativeWrapper.so
          LD_LIBRARY_PATH="$PWD/ThinkRail/bin" ldd ThinkRail/bin/libNativeWrapper.so | tee ldd.txt
          if grep -q 'not found' ldd.txt; then echo "unresolved shared library"; exit 1; fi

      - name: Fetch official desktop installer
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          URL="https://github.com/JetBrains/thinkrail/releases/download/${TAG}/thinkrail-desktop-linux-${UPSTREAM_ARCH}.tar.gz"
          echo "Downloading $URL"
          curl -fL --retry 3 --retry-delay 5 "$URL" -o official-desktop.tar.gz
          mkdir -p official-installer
          tar -xzf official-desktop.tar.gz -C official-installer installer
          test -x official-installer/installer

      - name: Package
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          cat > README-KYLIN.txt <<EOF
          ThinkRail ${VERSION} for Kylin V10 / glibc 2.31 / libwebkit2gtk-4.0-37
          ==========================================================================
          This build replaces ThinkRail's libNativeWrapper.so with one compiled
          against WebKitGTK 4.0 (2.38.x) and libsoup2.4 instead of 4.1/libsoup3.

          Install (official installer UX, single command):
              tar -xzf ThinkRail-${VERSION}-linux-${ARCH}-installer.tar.gz
              ./installer

          The installer runs the official ThinkRail installer, then swaps in the
          WebKitGTK 4.0 wrapper. It writes:
              ~/.local/share/ai.thinkrail.app/stable/app
              ~/.local/share/applications/ThinkRail.desktop
              ~/.local/share/ai.thinkrail.app/stable/uninstall

          Portable alternative (no desktop integration):
              tar -xzf ThinkRail-${VERSION}-linux-${ARCH}-kylin.tar.gz
              ./ThinkRail/bin/launcher

          Requirements:
              glibc >= 2.31
              libwebkit2gtk-4.0-37 (2.38.x), libgtk-3-0, libayatana-appindicator3-1

          Verified ABI:
              libNativeWrapper.so: GLIBC <= 2.31, GLIBCXX <= 3.4.28
              NEEDED: libwebkit2gtk-4.0.so.37, libsoup-2.4.so.1

          Notes:
              - Auto-update is left enabled in the upstream app. If ThinkRail
                updates itself it will replace this patched wrapper.
              - Wayland screen capture is disabled (no libpipewire build).
              - This is an unofficial compatibility build. Upstream support
                does not cover patched binaries.
          EOF
          tar -czf "dist/ThinkRail-${VERSION}-linux-${ARCH}-kylin.tar.gz" ThinkRail README-KYLIN.txt

          # Build the official-installer wrapper: the shell stub runs the real
          # Electrobun installer from its payload, then overlays our wrapper.
          mkdir -p payload installer-stage
          cp official-installer/installer payload/installer
          cp ThinkRail/bin/libNativeWrapper.so payload/libNativeWrapper.so
          cp README-KYLIN.txt payload/README-KYLIN.txt
          tar -czf payload.tar.gz -C payload installer libNativeWrapper.so README-KYLIN.txt
          cp "$GITHUB_WORKSPACE/apps/thinkrail/installer.sh" installer-stage/installer
          cat payload.tar.gz >> installer-stage/installer
          chmod +x installer-stage/installer
          cp README-KYLIN.txt installer-stage/README-KYLIN.txt
          tar -czf "dist/ThinkRail-${VERSION}-linux-${ARCH}-installer.tar.gz" \
            -C installer-stage installer README-KYLIN.txt

          # Smoke the installer in a throwaway HOME (no display => no launch).
          INSTALL_HOME="$RUNNER_TEMP/thinkrail-install"
          rm -rf "$INSTALL_HOME"; mkdir -p "$INSTALL_HOME"
          HOME="$INSTALL_HOME" ./installer-stage/installer --quiet --no-launch
          INSTALLED="$INSTALL_HOME/.local/share/ai.thinkrail.app/stable/app"
          test -x "$INSTALLED/bin/launcher"
          test -f "$INSTALL_HOME/.local/share/applications/ThinkRail.desktop"
          cmp "$INSTALLED/bin/libNativeWrapper.so" ThinkRail/bin/libNativeWrapper.so
          HOME="$INSTALL_HOME" "$INSTALL_HOME/.local/share/ai.thinkrail.app/stable/uninstall" --quiet || true
          test ! -e "$INSTALL_HOME/.local/share/ai.thinkrail.app"

          sha256sum dist/*.tar.gz > "dist/SHA256SUMS-${ARCH}.txt"
          ls -lh dist installer-stage payload

      - uses: actions/upload-artifact@v6
        with:
          name: thinkrail-kylin-${{ env.VERSION }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [resolve, build]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: thinkrail-kylin-${{ needs.resolve.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          REL="thinkrail-${TAG}"
          if ! gh release view "$REL" >/dev/null 2>&1; then
            gh release create "$REL" \
              --title "ThinkRail ${VERSION} (Kylin V10 / glibc 2.31)" \
              --notes "Unofficial Kylin-compatible build of ThinkRail ${VERSION}. Rebuilt libNativeWrapper.so against WebKitGTK 4.0 / libsoup2.4; ABI-gated to GLIBC <= 2.31." \
              --prerelease
          fi
          gh release upload "$REL" dist/* --clobber
