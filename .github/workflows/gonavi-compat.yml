name: GoNavi Compat Build (glibc 2.31)

# Wails v2.11.0 + webkit2gtk-4.0 (非 Tauri 的 4.1)
# Ubuntu 20.04 focal = glibc 2.31，官方源直接提供 libwebkit2gtk-4.0-dev
# 无需定制镜像，直接 ubuntu:20.04 容器即可，产物兼容麒麟 V10

on:
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本 tag（如 v0.9.4），留空跟踪上游最新 Release"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC 检查上游

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG=$(gh api repos/Syngnat/GoNavi/releases/latest --jq .tag_name)
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=gonavi-${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved: $TAG -> gonavi-$TAG"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          SKIPPED=false
          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -qi "Linux.*Amd64"; then
              echo "Release $RELEASE_TAG already has Linux assets"
              SKIPPED=true
            fi
          fi
          if [ -n "${{ inputs.version }}" ]; then
            SKIPPED=false
          fi
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

  build:
    name: Build GoNavi Linux ${{ matrix.arch }} (glibc 2.31)
    needs: resolve
    if: needs.resolve.outputs.skipped != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Install base tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git sudo \
            build-essential pkg-config file locales tzdata \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            upx-ucl libfuse2
          locale-gen en_US.UTF-8 2>/dev/null || true
          echo "glibc: $(ldd --version 2>&1 | grep -m1 -oE '[0-9]+\.[0-9]+$')"
          echo "webkit: $(pkg-config --modversion webkit2gtk-4.0 2>&1 || echo 'not found')"
          echo "OS: $(grep PRETTY_NAME /etc/os-release)"

      - name: Preflight — glibc <= 2.31
        run: |
          set -euo pipefail
          GLIBC_VER=$(ldd --version 2>&1 | grep -m1 -oE '[0-9]+\.[0-9]+$')
          echo "Container glibc: $GLIBC_VER"
          if [ "$(printf "2.31\n$GLIBC_VER" | sort -V | tail -1)" != "2.31" ]; then
            echo "::error::Container glibc $GLIBC_VER > 2.31"
            exit 1
          fi
          echo "✓ Preflight passed (glibc 2.31)"

      - name: Checkout GoNavi at tag
        uses: actions/checkout@v5
        with:
          repository: Syngnat/GoNavi
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install -v github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build frontend
        run: |
          set -euo pipefail
          mkdir -p frontend/dist
          printf '<!doctype html><title>GoNavi</title>\n' > frontend/dist/index.html
          wails generate module
          node frontend/scripts/wails-frontend-install.mjs
          npm --prefix frontend run build
          test -s frontend/dist/index.html

      - name: Build Wails binary
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          wails build -s -skipbindings -trimpath -platform linux/${{ matrix.goarch }} -clean -o GoNavi -ldflags "-s -w -X GoNavi-Wails/internal/app.AppVersion=${VERSION}"
          # wails -o is relative to build/bin, so output is build/bin/GoNavi
          ls -la build/bin/
          test -f build/bin/GoNavi
          chmod +x build/bin/GoNavi

      - name: Verify glibc compatibility
        run: |
          set -euo pipefail
          echo "=== ldd ==="
          ldd --version 2>&1 | awk 'NR==1{print; exit}'
          BINARY="build/bin/GoNavi"
          MAX=$(strings "$BINARY" | grep -o "GLIBC_[0-9.]*" | sort -V | tail -1 | sed 's/GLIBC_//' || echo "unknown")
          echo "Max GLIBC required: $MAX"
          if [ "$MAX" != "unknown" ] && [ "$(printf "2.31\n$MAX" | sort -V | tail -1)" != "2.31" ]; then
            echo "::error::Requires GLIBC $MAX > 2.31"
            exit 1
          fi
          echo "✓ GLIBC check passed (<= 2.31)"

      - name: Package tar.gz
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          ARCH_SUFFIX="Amd64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then ARCH_SUFFIX="Arm64"; fi
          TAR_NAME="GoNavi-${VERSION}-Linux-${ARCH_SUFFIX}.tar.gz"
          echo "UPX compress..."
          upx --best --lzma --force build/bin/GoNavi || echo "UPX skip"
          upx -t build/bin/GoNavi || true
          echo "Packaging $TAR_NAME..."
          tar -czvf "$TAR_NAME" -C build/bin GoNavi -C ../.. LICENSE NOTICE 2>/dev/null || tar -czvf "$TAR_NAME" -C build/bin GoNavi
          ls -lh "$TAR_NAME"
          sha256sum "$TAR_NAME" | tee "${TAR_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonavi-linux-${{ matrix.arch }}
          path: |
            GoNavi-*.tar.gz
            GoNavi-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: [resolve, build]
    if: needs.resolve.outputs.skipped != 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gonavi-linux-*
          merge-multiple: true

      - name: Create / Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists, uploading assets..."
          else
            NOTES=$(gh api "repos/Syngnat/GoNavi/releases/tags/$UPSTREAM_TAG" --jq '.body' 2>/dev/null || echo "")
            PREFIX="> **Compat build** — GoNavi 基于 Ubuntu 20.04 (glibc 2.31) 重新构建，兼容麒麟 V10。
          > 上游: https://github.com/Syngnat/GoNavi/releases/tag/$UPSTREAM_TAG
          > 运行时需 webkit2gtk-4.0 (focal/bullseye 默认提供)"
            NOTES="${PREFIX}

          ---

          ${NOTES:- compat build}"
            gh release create "$RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$RELEASE_TAG (glibc 2.31 compat)" \
              --notes "$NOTES" \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --clobber GoNavi-*.tar.gz GoNavi-*.tar.gz.sha256
          gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'
