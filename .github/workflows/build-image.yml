name: Build Compat Image (glibc 2.31 + webkit2gtk-4.1)

# 构建定制镜像并推送到 ghcr.io（无需本地 Docker，CI 双架构原生构建）
# 镜像构成：debian:bullseye (glibc 2.31) + 源码编译 glib 2.72 / libsoup3 / WebKitGTK 2.40.6
#
# 触发时机：
# - 手动（首次部署必跑一次，约 2~3 小时/架构）
# - Dockerfile 变更推送到 main 时自动重建
# 后续 App Build 工作流直接引用 ghcr 镜像，不再重新编译 webkit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/tauri2-webkit41.Dockerfile"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/xc-compat-tauri2

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tauri2-webkit41.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.arch }}
          # GitHub registry 暂不支持 inline cache 导出，用 registry cache
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.arch }},mode=max

      - name: Verify image
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ matrix.arch }} sh -c '
            ldd --version | head -1
            pkg-config --modversion webkit2gtk-4.1
            echo "glib: $(pkg-config --modversion glib-2.0)"
            echo "soup: $(pkg-config --modversion libsoup-3.0)"
          '
