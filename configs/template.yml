# 新软件配置模板 — 复制为 configs/<app-id>.yml 后按注释填写
# 填好后：手动触发 App Build 填 <app-id>，或在 apps.yml 注册参与定时批量构建

app_id: myapp
upstream_repo: owner/repo        # 必填
display_name: MyApp              # 可选，Release 标题展示名

# 构建镜像（glibc 2.31 基底）：
# - Tauri 2 应用：必须用定制镜像（glibc 2.31 公共源无 webkit2gtk-4.1，
#   已实测确认）。先在 Actions 手动跑一次 "Build Compat Image"
#   （约 2~3h/架构，仅需一次），然后填：
#   container_image:      ghcr.io/sondertara/xc-compat-tauri2:amd64
#   container_image_arm64: ghcr.io/sondertara/xc-compat-tauri2:aarch64
# - 非 Tauri / 无 webkit 依赖：直接 debian:bullseye，两个都填它或省略 arm64
container_image: "ghcr.io/sondertara/xc-compat-tauri2:amd64"
container_image_arm64: "ghcr.io/sondertara/xc-compat-tauri2:aarch64"

# 工具链版本（默认与 dbx 官方对齐）
node_version: "22"
pnpm_version: "10.27.0"
rust_version: "1.97.1"

# apt 依赖（webkit2gtk-4.1 已内置在定制镜像中，勿重复安装）
build_deps: >
  libayatana-appindicator3-dev librsvg2-dev libxdo-dev
  patchelf libssl-dev xdg-utils libsecret-1-dev

# 命令模板，占位符：{target} → rust triple，{version} → 版本号
install_command: pnpm install --frozen-lockfile
build_command: pnpm tauri build --bundles appimage --target {target}

# 产物命名模板，占位符：{app} {version} {arch}（arch = amd64 / aarch64）
artifact_name: "{app}_{version}_{arch}.AppImage"
