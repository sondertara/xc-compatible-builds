# DBX is adapted via the MyGO WebKitGTK 4.0 desktop shell + upstream's
# official fully-static musl dbx-web-bin sidecar, built by
# .github/workflows/dbx-compat.yml (not app-build.yml).
#
# Why not Tauri 2 (app-build.yml):
# Tauri 2 / wry requires webkit2gtk-4.1 (>= 2.40) and a 3-hour custom base
# image on glibc 2.31, whereas dbx-desktop uses CGO_ENABLED=0 MyGO (purego
# dlopen against Kylin V10's system libwebkit2gtk-4.0.so.37 / 2.38.x and GTK3)
# and launches upstream DBX_<ver>_<x64|arm64>-browser-static.tar.gz's
# static dbx-web-bin in-place.
app_id: dbx
upstream_repo: t8y2/dbx
display_name: DBX
build_type: mygo-sidecar
workflow: dbx-compat.yml

container_image: "ubuntu:20.04"
container_image_arm64: ""

build_deps: >
  libwebkit2gtk-4.0-dev libgtk-3-dev pkg-config binutils file python3

# Upstream artifact is DBX_<version>_<x64|arm64>-browser-static.tar.gz.
# Sidecar framework lives in shared/mygo-sidecar/; DBX adapter & packaging
# assets live in apps/dbx/.
artifact_name: "DBX-{version}-linux-{arch}-installer.tar.gz"
