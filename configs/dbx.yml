app_id: dbx
upstream_repo: t8y2/dbx
display_name: DBX

# !! 前置条件 !!
# Tauri 2 (wry) 需要 webkit2gtk-4.1 (>=2.40)，但 glibc 2.31 的公共源
# (bullseye/focal main+security) 均只有 4.0 API —— 已实测确认。
# 必须先在 Actions 里手动跑一次 "Build Compat Image" 工作流
# （构建 debian:bullseye + 源码 webkit2gtk-2.40.6 镜像，约 2~3h/架构，仅需一次），
# 产物在 ghcr.io/sondertara/xc-compat-tauri2:{amd64,aarch64}
container_image: "ghcr.io/sondertara/xc-compat-tauri2:amd64"
container_image_arm64: "ghcr.io/sondertara/xc-compat-tauri2:aarch64"

node_version: "22"
pnpm_version: "10.27.0"
# 与上游官方 release.yml 一致（1.88 只是 MSRV，会编译失败）
rust_version: "1.97.1"

# webkit2gtk-4.1 及其编译依赖已内置在定制镜像中，这里只装轻量运行/链接依赖
build_deps: >
  libayatana-appindicator3-dev librsvg2-dev libxdo-dev
  patchelf libssl-dev xdg-utils libsecret-1-dev

# {target} 会替换为 x86_64-unknown-linux-gnu / aarch64-unknown-linux-gnu
install_command: pnpm install --frozen-lockfile
build_command: pnpm tauri build --bundles appimage --target {target}

# 与官方命名一致：DBX_0.5.91_amd64.AppImage / DBX_0.5.91_aarch64.AppImage
artifact_name: "DBX_{version}_{arch}.AppImage"
