app_id: gonavi
upstream_repo: Syngnat/GoNavi
display_name: GoNavi
build_type: go-wails
workflow: gonavi-build.yml

# glibc 2.31 兼容构建（麒麟 V10）
# GoNavi 是 Wails v2 应用，Linux 使用 webkit2gtk-4.0 (非 4.1)
# Ubuntu 20.04 focal 也是 glibc 2.31，且官方源直接提供 libwebkit2gtk-4.0-dev
# 无需定制镜像，直接使用 ubuntu:20.04 即可
container_image: "ubuntu:20.04"
container_image_arm64: "ubuntu:20.04"

# Go/Wails 版本由 go.mod 决定；构建逻辑在 gonavi-build.yml。
# 注意：reusable 工作流默认使用 Rust，这里需要 Go，需配合专用工作流。

# Wails Linux 构建依赖（webkit 4.0，非 Tauri 的 4.1）
# 对应 GoNavi release.yml 的 Install Linux Dependencies 步骤
build_deps: >
  libgtk-3-dev libwebkit2gtk-4.0-dev
  upx-ucl libfuse2
  build-essential pkg-config

# 构建命令/工具链由 gonavi-build.yml 负责；这里只声明镜像、依赖和产物。

# 产物命名：与上游 release.yml 的 tar.gz 命名对齐
# 上游为 GoNavi-0.9.4-Linux-Amd64.tar.gz，这里生成兼容版
artifact_name: "GoNavi-{version}-Linux-{arch}.tar.gz"
